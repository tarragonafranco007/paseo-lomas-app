<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3F4A3B">
<title>Paseo Lomas · App</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#1E231D;--gris:#69705F;--gris2:#9aa093;--linea:#E3E3DA;--fondo:#F6F5F0;--blanco:#fff;
  --marca:#5C6B57;--marca-osc:#3F4A3B;--marca-suave:#E9EDE4;--arena:#C9B89A;
  --libre:#2E9E5B;--libre-s:#DDF3E5;--apart:#D79A1E;--apart-s:#FBEFD3;--rent:#9A9C93;--rent-s:#ECECE7;--rojo:#C0392B;
  --sombra:0 10px 30px rgba(30,35,29,.10);--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--fondo);color:var(--tinta);font:400 15px/1.5 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.ic{flex:none;display:inline-block;vertical-align:middle}
h1,h2,h3,h4{font-family:Poppins,sans-serif;line-height:1.2}
.oculto{display:none!important}
.sub{color:var(--gris);font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 18px;font-weight:600;background:var(--marca);color:#fff;transition:.15s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--marca-osc)}
.btn.sec{background:var(--blanco);color:var(--marca-osc);border:1.5px solid var(--marca)}
.btn.sec:hover{background:var(--marca-suave)}
.btn.suave{background:var(--marca-suave);color:var(--marca-osc)}
.btn.peligro{background:#fbe9e7;color:var(--rojo)}
.btn.chico{padding:7px 13px;font-size:13px}
.btn.ancho{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1.5px solid var(--linea);background:var(--blanco);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--gris);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{border-color:var(--marca);color:var(--marca-osc);background:var(--marca-suave)}
.estado{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
.estado.libre,.estado.abierto{background:var(--libre-s);color:#1d6b3c}
.estado.apartado,.estado.prox{background:var(--apart-s);color:#8a5f08}
.estado.rentado,.estado.cerrado{background:var(--rent-s);color:#5f6158}
label{font-size:13px;font-weight:600;display:grid;gap:5px}
input,select,textarea{border:1.5px solid var(--linea);border-radius:11px;padding:10px 12px;background:#fff;width:100%;font-weight:400}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--marca)}
input[type=checkbox]{width:auto;accent-color:var(--marca);transform:scale(1.2)}
input[type=color]{padding:3px;height:42px}
.form{display:grid;gap:12px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tarjeta{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:16px}
.vacio{text-align:center;color:var(--gris);padding:28px 10px;font-size:14px}
.punto{width:9px;height:9px;border-radius:50%;display:inline-block}
.aviso-demo{position:relative;z-index:50;background:#FFF7E3;color:#7A5A12;font-size:12px;padding:5px 12px;border-bottom:1px solid #F1E2B8;display:flex;justify-content:space-between;align-items:center;gap:10px}
.aviso-demo a{font-weight:700;display:inline-flex;gap:5px;align-items:center;background:#7A5A12;color:#fff;border-radius:999px;padding:3px 10px}

/* ---------- Portada (elegir vista) ---------- */
.inicio{min-height:100vh;display:grid;grid-template-rows:1fr auto;background:#2b3128 url(img/p7.jpg) center/cover;position:relative;color:#fff}
.inicio::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,24,19,.25),rgba(20,24,19,.85))}
.inicio>*{position:relative}
.inicio .cab{display:flex;align-items:center;gap:12px;padding:22px 24px}
.inicio .cab img{height:44px;filter:brightness(0) invert(1)}
.inicio .cab b{font:600 20px Poppins}
.inicio .centro{max-width:1080px;margin:0 auto;padding:0 20px 50px;align-self:end;width:100%}
.inicio h1{font:800 clamp(32px,5vw,54px)/1.05 Poppins;max-width:720px;margin-bottom:10px}
.inicio p.lead{max-width:560px;opacity:.92;margin-bottom:26px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rol{background:rgba(255,255,255,.95);color:var(--tinta);border-radius:20px;padding:20px;text-align:left;display:grid;gap:8px;transition:.15s;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.rol:hover{transform:translateY(-3px)}
.rol .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--marca-suave);color:var(--marca-osc)}
.rol h3{font-size:18px}
.rol p{color:var(--gris);font-size:13.5px}
.rol span{color:var(--marca);font-weight:700;font-size:13.5px}

/* ---------- App de clientes ---------- */
.escena-movil{min-height:100vh;background:#d9ded3 url(img/p12.jpg) center/cover fixed}
.escena-movil::before{content:"";position:fixed;inset:0;background:rgba(233,237,228,.82);backdrop-filter:blur(6px)}
.movil{position:relative;max-width:440px;margin:0 auto;min-height:100vh;background:var(--fondo);box-shadow:0 0 50px rgba(0,0,0,.18);padding-bottom:84px}
.c-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(246,245,240,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea)}
.c-top img{height:30px}
.c-top b{font:600 16px Poppins;flex:1}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--blanco);border:1px solid var(--linea);position:relative;color:var(--tinta)}
.ibtn .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--rojo);color:#fff;font:700 10.5px/18px Inter;text-align:center;padding:0 4px}
.c-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--linea);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.c-nav a{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--gris2);text-decoration:none;padding:4px 0}
.c-nav a.on{color:var(--marca-osc)}
.c-nav a.on .ic{stroke-width:2.4}
.c-sec{padding:16px}
.c-sec h2.t{font-size:18px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.c-sec h2.t a{font:600 13px Inter;color:var(--marca);text-decoration:none}
.hero{position:relative;height:200px;padding-bottom:40px!important;background:#333 url(img/p12.jpg) center/cover;color:#fff;display:flex;align-items:flex-end;padding:16px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.65))}
.hero>*{position:relative}
.hero small{opacity:.9}
.hero h1{font-size:26px}
.tpuntos{margin:-26px 16px 0;position:relative;z-index:2;border-radius:20px;padding:16px 18px;color:#fff;background:linear-gradient(135deg,#3F4A3B,#6E8166);box-shadow:var(--sombra);display:grid;gap:8px;cursor:pointer}
.tpuntos .fila{display:flex;justify-content:space-between;align-items:center}
.tpuntos b{font:800 34px Poppins;line-height:1}
.tpuntos .nivel{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.barra{height:7px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.barra i{display:block;height:100%;background:#F2D27A;border-radius:9px}
.carrusel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.carrusel::-webkit-scrollbar{display:none}
.carrusel>*{scroll-snap-align:start;flex:none}
.promo{width:250px;border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--linea);text-align:left;display:block}
.promo .img{height:110px;display:grid;place-items:center;font-size:46px;background-size:cover;background-position:center}
.promo .txt{padding:10px 12px}
.promo b{font:600 14.5px Poppins;display:block}
.promo small{color:var(--gris);font-size:12.5px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px 4px;display:grid;justify-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--gris)}
.cat span{font-size:24px}
.mini{width:140px;background:#fff;border:1px solid var(--linea);border-radius:16px;padding:12px;display:grid;justify-items:center;gap:6px;text-align:center}
.mini b{font:600 13.5px Poppins;line-height:1.2}
.mini small{font-size:11.5px;color:var(--gris)}
.logo{border-radius:50%;display:grid;place-items:center;color:#fff;font:700 15px Poppins;background-size:cover;background-position:center;flex:none;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.evento{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--linea);border-radius:16px;padding:12px;margin-bottom:10px}
.evento .fecha{width:52px;height:56px;border-radius:12px;background:var(--marca-suave);color:var(--marca-osc);display:grid;place-items:center;text-align:center;font:700 18px/1 Poppins;flex:none}
.evento .fecha small{display:block;font:700 10px Inter;text-transform:uppercase;letter-spacing:.06em}
.evento b{font-weight:600;display:block}
.banner{margin-top:22px;border-radius:20px;padding:18px;background:var(--tinta) url(img/p7.jpg) center/cover;color:#fff;position:relative;overflow:hidden;cursor:pointer}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,24,19,.9),rgba(20,24,19,.35))}
.banner>*{position:relative}
.banner h3{font-size:18px;margin-bottom:4px;max-width:240px}
.banner p{font-size:13px;opacity:.9;max-width:240px;margin-bottom:12px}
.buscar{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--linea);border-radius:14px;padding:0 12px}
.buscar input{border:0;padding:11px 0}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 4px;padding:0 16px 4px;scrollbar-width:none}
.tienda{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--linea);border-radius:18px;padding:10px;margin-top:10px;width:100%;text-align:left}
.tienda .th{width:84px;height:84px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:34px;background-size:cover;background-position:center;position:relative}
.tienda .th .logo{position:absolute;right:-6px;bottom:-6px}
.tienda .inf{flex:1;min-width:0}
.tienda b{font:600 15.5px Poppins;display:block}
.tienda .meta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.fav{color:var(--gris2)}
.fav.on{color:#e0475b}
.fav.on svg{fill:#e0475b}
.portada{height:220px;display:grid;place-items:center;font-size:80px;background-size:cover;background-position:center;position:relative}
.portada .volver{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92)}
.portada .fav-b{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92)}
.ficha{background:var(--fondo);border-radius:22px 22px 0 0;margin-top:-22px;position:relative;padding:0 16px 16px}
.ficha .cabf{display:flex;gap:12px;align-items:flex-end;transform:translateY(-26px);margin-bottom:-14px}
.ficha h1{font-size:23px}
.acciones4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.acc{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px 4px;display:grid;justify-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--marca-osc)}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--linea);margin:6px -16px 12px;padding:0 16px;scrollbar-width:none}
.tabs button{padding:10px 10px;font-weight:600;font-size:14px;color:var(--gris);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--tinta);border-color:var(--marca)}
.prod{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linea)}
.prod .pi{width:62px;height:62px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:26px;background-size:cover;background-position:center}
.prod .pn{flex:1;min-width:0}
.prod b{font-weight:600}
.prod small{display:block;color:var(--gris);font-size:12.5px}
.prod .pp{font:700 15px Poppins;white-space:nowrap}
.gcat{font:700 12px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin:16px 0 2px}
.galeria{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.galeria div{aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:30px}
.recomp{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--linea);border-radius:16px;padding:12px;margin-bottom:10px}
.recomp .pts{min-width:62px;text-align:center;border-radius:12px;padding:8px 4px;background:#FBF3DF;color:#8a5f08;font:700 16px/1.1 Poppins}
.recomp .pts small{display:block;font:600 10px Inter;text-transform:uppercase}
.horario{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px}
.horario .hoy{font-weight:700}
.qrbox{background:#fff;border-radius:22px;padding:20px;display:grid;justify-items:center;gap:10px;box-shadow:var(--sombra);text-align:center}
#qr{width:190px;height:190px;display:grid;place-items:center}
#qr img,#qr canvas{width:190px!important;height:190px!important}
.codigo{font:700 20px Poppins;letter-spacing:.12em}
.pasos{display:grid;gap:10px}
.paso{display:flex;gap:12px;align-items:flex-start}
.paso i{width:28px;height:28px;border-radius:50%;background:var(--marca);color:#fff;display:grid;place-items:center;font:700 13px Inter;font-style:normal;flex:none}
.mov{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea);font-size:14px}
.mov b.mas{color:var(--libre)} .mov b.menos{color:var(--rojo)}
.cupon{border:2px dashed var(--arena);border-radius:16px;padding:12px 14px;background:#fffdf7;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.cupon.usado{opacity:.5}
.cupon .cod{font:700 17px Poppins;letter-spacing:.1em}
.fila-ajuste{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--linea)}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;cursor:pointer;z-index:1;width:100%;height:100%;transform:none}
.sw span{position:absolute;inset:0;border-radius:99px;background:#cfd2c9;transition:.2s}
.sw span::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--libre)}
.sw input:checked+span::after{left:23px}

/* Mapa */
.mapa{background:#fff;border-radius:18px;border:1px solid var(--linea);overflow:hidden;position:relative}
.mapa .desliza{overflow:auto;-webkit-overflow-scrolling:touch}
.mapa svg{display:block;width:100%;height:auto}
.movil .mapa svg{width:820px;max-width:none}
.zona{cursor:pointer;stroke:#fff;stroke-width:1.2;transition:fill-opacity .15s}
.zona:hover,.zona.sel{fill-opacity:.95!important;stroke:var(--tinta);stroke-width:2.2}
.etq{font:700 9px Inter;fill:#fff;pointer-events:none;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px}
.etq.g{font-size:12px}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--linea);font-size:12.5px;color:var(--gris)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.hoja{position:sticky;bottom:84px;margin-top:12px;background:#fff;border-radius:18px;box-shadow:0 -6px 30px rgba(0,0,0,.12);padding:14px;display:flex;gap:12px;align-items:center;border:1px solid var(--linea)}

/* ---------- Paneles (negocio y administración) ---------- */
.papp{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.lateral{background:var(--tinta);color:#dfe4d9;padding:18px 14px;position:sticky;top:0;height:100vh;max-height:calc(100vh - 0px);overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.lateral .quien{display:flex;gap:10px;align-items:center;padding:6px 6px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:10px}
.lateral .quien b{font:600 15px Poppins;color:#fff;display:block;line-height:1.2}
.lateral .quien small{font-size:12px;opacity:.7}
.lateral a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:500;font-size:14.5px;color:#cfd5c8}
.lateral a:hover{background:rgba(255,255,255,.06)}
.lateral a.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.lateral .esp{flex:1}
.contenido{padding:26px 30px 60px;max-width:1150px;width:100%}
.cabp{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.cabp h1{font-size:26px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:16px}
.kpi small{color:var(--gris);font-size:12.5px;font-weight:600}
.kpi b{display:block;font:700 28px Poppins;margin-top:4px}
.kpi span{font-size:12px;color:var(--libre);font-weight:600}
.rejilla{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.barras{display:flex;align-items:flex-end;gap:10px;height:160px;margin-top:14px}
.barras div{flex:1;display:grid;justify-items:center;gap:6px;font-size:11.5px;color:var(--gris);height:100%;align-content:end}
.barras i{width:100%;max-width:44px;background:var(--marca);border-radius:8px 8px 3px 3px;display:block}
.barras b{font-size:12px;color:var(--tinta)}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px}
.check i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--rent-s);color:#fff;font-style:normal;flex:none}
.check.ok i{background:var(--libre)}
.progreso{height:9px;border-radius:9px;background:var(--rent-s);overflow:hidden;margin:8px 0 6px}
.progreso i{display:block;height:100%;background:var(--libre)}
.subir{border:2px dashed var(--linea);border-radius:16px;padding:16px;display:grid;place-items:center;gap:6px;text-align:center;color:var(--gris);cursor:pointer;background:#fff;position:relative;overflow:hidden;background-size:cover;background-position:center;font-size:13px}
.subir:hover{border-color:var(--marca)}
.subir input{position:absolute;inset:0;opacity:0;cursor:pointer}
.subir.con-img{border-style:solid;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.foto{aspect-ratio:1;border-radius:14px;background-size:cover;background-position:center;position:relative;border:1px solid var(--linea)}
.foto .herr{position:absolute;bottom:6px;left:6px;right:6px;display:flex;justify-content:space-between}
.foto .herr button{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center}
.tabla{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
.tabla th,.tabla td{padding:11px 12px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:middle}
.tabla th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--gris);background:var(--fondo);font-weight:600}
.tabla-c{border:1px solid var(--linea);border-radius:16px;overflow:auto}
.lista-f{display:grid;gap:10px}
.item-f{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px 12px}
.item-f .pi{width:54px;height:54px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:24px;background-size:cover;background-position:center}
.item-f .inf{flex:1;min-width:0}
.item-f b{font-weight:600}
.item-f small{display:block;color:var(--gris);font-size:12.5px}
.item-f.apagado{opacity:.55}
.hor{display:grid;grid-template-columns:110px auto 1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linea)}
.nota-p{background:var(--marca-suave);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--marca-osc)}
.panel-mov{display:none}
/* Modal */
.velo{position:fixed;inset:0;background:rgba(20,24,19,.5);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.velo.on{display:flex}
.modal{background:#fff;border-radius:22px;width:min(520px,100%);max-height:92vh;overflow-y:auto;padding:22px;position:relative;animation:sube .2s ease}
@keyframes sube{from{transform:translateY(16px);opacity:0}}
.modal h3{font-size:20px;margin-bottom:12px;padding-right:36px}
.modal .x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--fondo);display:grid;place-items:center}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.cambiar{position:fixed;top:12px;right:12px;z-index:60;background:rgba(30,35,29,.88);color:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center;text-decoration:none;backdrop-filter:blur(6px)}
@media (max-width:900px){
  .roles{grid-template-columns:1fr}
  .papp{grid-template-columns:1fr}
  .lateral{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:10px;z-index:40;gap:6px}
  .lateral .quien,.lateral .esp{display:none}
  .lateral a{white-space:nowrap;padding:8px 12px;font-size:13.5px}
  .contenido{padding:18px 16px 60px}
  .kpis{grid-template-columns:1fr 1fr}
  .rejilla{grid-template-columns:1fr}
  .hor{grid-template-columns:1fr auto;}
  .hor input[type=time]{grid-column:span 1}
  .cambiar{top:auto;bottom:16px;right:16px}
  body.en-cliente .cambiar{bottom:96px}
}
@media (max-width:520px){
  .dos,.tres{grid-template-columns:1fr}
  .velo{align-items:flex-end;padding:0}
  .modal{border-radius:22px 22px 0 0;max-height:88vh}
}

function abiertoAhora(n, ahora = new Date()) {
  const h = n.horario[DIAS[ahora.getDay()]]; if (!h || h.cerrado) return false;
  const m = ahora.getHours() * 60 + ahora.getMinutes();
  const aM = +h.a.slice(0, 2) * 60 + +h.a.slice(3), cM = +h.c.slice(0, 2) * 60 + +h.c.slice(3);
  return cM > aM ? m >= aM && m < cM : (m >= aM || m < cM);
}
const horaTxt = h => h.cerrado ? 'Cerrado' : (h.a === '00:00' && h.c === '24:00' ? 'Abierto 24 horas' : `${h.a} a ${h.c}`);
const hoyTxt = n => horaTxt(n.horario[DIAS[new Date().getDay()]]);
function nivel(acum) {
  const nv = DB.config.niveles; let i = 0; while (i + 1 < nv.length && acum >= nv[i + 1][1]) i++;
  const sig = nv[i + 1]; return {n:nv[i][0], sig:sig && sig[0], falta:sig ? sig[1] - acum : 0, pct:sig ? Math.round((acum - nv[i][1]) / (sig[1] - nv[i][1]) * 100) : 100};
}
const fFecha = s => new Date(s + 'T12:00:00').toLocaleDateString('es-MX', {day:'numeric', month:'short'});

function leerImagen(file, max = 1100) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('No es una imagen'));
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .78));
    }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function mapaSVG(colorear, accion, sel) {

      <text class="etq${l.tipo === 'ancla' ? ' g' : ''}" x="${cx}" y="${cy}">${c.e ?? (l.tipo === 'ancla' ? l.id : l.id.slice(1))}</text>`;
  }).join('');
  return `<svg viewBox="40 230 1380 785" role="img" aria-label="Plano de Paseo Lomas"><image href="${IMG.plano}" x="40" y="230" width="1380" height="785"/>${pol}</svg>`;
}

      <form class="tarjeta form" data-f="config"><h3 style="font-size:16px">Reglas del programa</h3>
        <label>Nombre del programa<input name="programa" value="${esc(cfg.programa)}" required></label>
        <div class="dos"><label>Pesos por cada punto<input name="pesosPorPunto" type="number" min="1" value="${cfg.pesosPorPunto}"></label><label>Bono de bienvenida<input name="bono" type="number" min="0" value="${cfg.bono}"></label></div>
        <div class="tres">${cfg.niveles.map(([n, p], i) => `<label>Nivel ${esc(n)} desde<input name="nivel${i}" type="number" min="0" value="${p}" ${i === 0 ? 'readonly' : ''}></label>`).join('')}</div>
        <button class="btn">Guardar reglas</button></form>
      <div class="tarjeta"><h3 style="font-size:16px;margin-bottom:8px">Negocios que más puntos dan</h3>
        ${top.map(([n, p]) => `<div class="check" style="justify-content:space-between">${logoHTML(n, 30)}<span style="flex:1">${esc(n.nombre)}</span><b>${p.toLocaleString('es-MX')}</b></div>`).join('')}</div>
    </div>`);
}
function vaAjustes() {
  return aShell('ajustes', `<div class="cabp"><div><h1>Ajustes</h1></div></div>
    <div class="tarjeta form" style="max-width:560px"><h3 style="font-size:16px">Demo</h3><p class="sub">Todo lo que se cambia en esta demo se guarda solo en este navegador. Puedes volver a los datos de ejemplo cuando quieras.</p>
      <button class="btn peligro" data-a="reiniciar">Reiniciar demo</button></div>
    <div class="tarjeta" style="max-width:560px;margin-top:14px"><h3 style="font-size:16px;margin-bottom:6px">En la versión final</h3>
      <ul class="sub" style="padding-left:18px;display:grid;gap:4px"><li>Acceso con usuario y contraseña para la administración y para cada negocio.</li><li>Base de datos en la nube y fotos en almacenamiento seguro.</li><li>Escaneo del QR de puntos con la cámara del celular.</li><li>Notificaciones a los clientes de promociones y eventos.</li><li>Las solicitudes de renta llegan a WhatsApp y al CRM.</li></ul></div>`);
}

/* =====================================================================
   Enrutador
   ===================================================================== */
let despues = [];
function render() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  const [rol, sec, id] = h;
  despues = [];
  let html;
  document.body.classList.toggle('en-cliente', rol === 'c');
  if (rol === 'c') {
    html = ({inicio:vcInicio, tiendas:vcTiendas, tienda:() => vcTienda(id), mapa:vcMapa, puntos:vcPuntos, perfil:vcPerfil, rentar:() => vcRentar(id)}[sec] || vcInicio)();
    if (sec === 'puntos') despues.push(pintarQR);
    if (sec === 'rentar' && id) despues.push(() => fichaRenta(id));
    if (sec === 'mapa' && ST.selMapa) despues.push(centrarMapa);
  } else if (rol === 'n') {
    if (!DB.sesion || !DB.negocios[DB.sesion] || !sec) html = vnEntrar();
    else html = ({resumen:vnResumen, perfil:vnPerfil, fotos:vnFotos, productos:vnProductos, promos:vnPromos, horario:vnHorario, puntos:vnPuntos}[sec] || vnResumen)();
    if (sec === 'puntos') despues.push(() => { const f = $('[data-f=darPuntos]'); f && f.monto.addEventListener('input', () => { $('#calcPts').textContent = `El cliente recibirá ${Math.floor((+f.monto.value || 0) / DB.config.pesosPorPunto)} puntos.`; }); });
  } else if (rol === 'a') {
    html = ({resumen:vaResumen, locales:vaLocales, negocios:vaNegocios, avisos:vaAvisos, puntos:vaPuntos, ajustes:vaAjustes}[sec] || vaResumen)();
  } else html = vInicio();
  $('#app').innerHTML = (rol ? `<div class="aviso-demo"><span>Demo · datos de ejemplo</span><a href="#/">${ic('cambiar', 13)} Cambiar vista</a></div>` : '') + html;
  despues.forEach(f => f());
}
function pintarQR() {
  const el = $('#qr'); if (!el) return;
  if (window.QRCode) new QRCode(el, {text:'PASEOLOMAS:' + DB.cliente.codigo, width:190, height:190, colorDark:'#1E231D', colorLight:'#ffffff'});
  else el.innerHTML = `<div class="vacio">${ic('qr', 60)}</div>`;
}
function centrarMapa() {
  const d = $('#desliza'), p = $(`polygon[data-id="${ST.selMapa}"]`); if (!d || !p) return;
  const r = p.getBoundingClientRect(), rd = d.getBoundingClientRect();
  d.scrollLeft += r.left + r.width / 2 - rd.left - rd.width / 2;
}
const ir = h => { if (location.hash === h) render(); else location.hash = h; };
addEventListener('hashchange', () => { if (!ST.keepTab) ST.tab = 'menu'; ST.keepTab = false; cerrarModal(); render(); scrollTo(0, 0); });

/* =====================================================================
   Acciones
   ===================================================================== */
const A = {
  cerrarModal,
  ir: el => ir(el.dataset.h),
  verAvisos: () => modal(`<h3>Avisos de Paseo Lomas</h3>${DB.avisos.filter(a => a.para !== 'negocios').map(eventoHTML).join('') || '<p class="sub">Sin avisos.</p>'}`),
  verCat: el => { ST.cat = el.dataset.cat; ST.q = ''; ir('#/c/tiendas'); },
  tab: el => { ST.tab = el.dataset.t; render(); },
  tabRecomp: () => { ST.tab = 'recomp'; ST.keepTab = true; },
  fav: el => { const f = DB.cliente.favoritos, id = el.dataset.id; const i = f.indexOf(id); i < 0 ? f.push(id) : f.splice(i, 1); guardar(); toast(i < 0 ? 'Guardado en tus favoritos' : 'Quitado de favoritos'); render(); },
  whats: el => { DB.stats[el.dataset.id].wa++; guardar(); toast('En la versión final abre WhatsApp con el negocio.'); },
  llamar: () => toast('En la versión final inicia la llamada al negocio.'),
  ubicar: el => { ST.selMapa = el.dataset.id; ir('#/c/mapa'); },
  verFoto: el => modal(`<img src="${el.dataset.src}" style="width:100%;border-radius:14px;margin-top:20px">`),
  canjear: el => {
    const n = DB.negocios[el.dataset.n], r = n.recompensas.find(x => x.id === el.dataset.r), c = DB.cliente;
    if (c.puntos < r.puntos) return toast('Aún no te alcanzan los puntos.');
    modal(`<h3>¿Canjear ${esc(r.titulo)}?</h3><p class="sub">Se descontarán <b>${r.puntos} puntos</b>. Te quedarán ${c.puntos - r.puntos}.</p>
      <div style="display:flex;gap:10px;margin-top:18px"><button class="btn sec" data-a="cerrarModal">Cancelar</button><button class="btn" data-a="confirmarCanje" data-n="${n.id}" data-r="${r.id}">Canjear</button></div>`);
  },
  confirmarCanje: el => {
    const n = DB.negocios[el.dataset.n], r = n.recompensas.find(x => x.id === el.dataset.r), c = DB.cliente;
    const k = {codigo:(n.nombre.match(/\b\w/g) || ['P']).slice(0, 2).join('').toUpperCase() + '-' + codigo(), titulo:r.titulo, negocio:n.nombre, n:n.id, puntos:r.puntos, usado:false};
    c.puntos -= r.puntos; c.cupones.unshift(k); c.historial.unshift({f:new Date().toISOString().slice(0, 10), t:n.nombre, d:'Canje: ' + r.titulo, p:-r.puntos}); guardar();
    modal(`<div style="text-align:center"><div style="font-size:52px">🎉</div><h3 style="padding:0">¡Listo! Tu cupón</h3><div class="cupon" style="justify-content:center;margin:14px 0"><div class="cod" style="font-size:24px">${k.codigo}</div></div>
      <p class="sub">Muéstralo en ${esc(n.nombre)} para recibir: <b>${esc(r.titulo)}</b>. También queda guardado en «Mis puntos».</p><button class="btn ancho" style="margin-top:16px" data-a="cerrarModal">Entendido</button></div>`);
    $('#velo').addEventListener('click', render, {once:true});
  },
  selMapa: el => { ST.selMapa = el.dataset.id; render(); },
  rentarLocal: el => fichaRenta(el.dataset.id),
  filtroRenta: el => { ST.filtroRenta = el.dataset.f; render(); },
  // negocio
  entrarNegocio: el => { DB.sesion = el.dataset.id; guardar(); ir('#/n/resumen'); },
  salirNegocio: () => { DB.sesion = null; guardar(); },
  quitarImg: el => { DB.negocios[DB.sesion][el.dataset.c] = ''; guardar(); render(); },
  moverFoto: el => { const f = DB.negocios[DB.sesion].fotos, i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= f.length) return; [f[i], f[j]] = [f[j], f[i]]; guardar(); render(); },
  borrarFoto: el => { DB.negocios[DB.sesion].fotos.splice(+el.dataset.i, 1); guardar(); render(); },
  usarPortada: el => { const n = DB.negocios[DB.sesion]; n.portada = n.fotos[+el.dataset.i]; guardar(); toast('Foto puesta como portada'); },
  editarProd: el => formProd(el.dataset.id && DB.negocios[DB.sesion].productos.find(p => p.id === el.dataset.id)),
  borrarProd: el => { const n = DB.negocios[DB.sesion]; n.productos = n.productos.filter(p => p.id !== el.dataset.id); guardar(); cerrarModal(); render(); toast('Producto borrado'); },
  editarPromo: el => formPromo(el.dataset.id && DB.negocios[DB.sesion].promos.find(p => p.id === el.dataset.id)),
  borrarPromo: el => { const n = DB.negocios[DB.sesion]; n.promos = n.promos.filter(p => p.id !== el.dataset.id); guardar(); cerrarModal(); render(); toast('Promoción borrada'); },
  editarRecomp: el => formRecomp(el.dataset.id && DB.negocios[DB.sesion].recompensas.find(r => r.id === el.dataset.id)),
  borrarRecomp: el => { const n = DB.negocios[DB.sesion]; n.recompensas = n.recompensas.filter(r => r.id !== el.dataset.id); guardar(); cerrarModal(); render(); },
  copiarLunes: () => { const f = $('[data-f=horario]'); ['mar','mie','jue','vie','sab','dom'].forEach(d => { f[d + '_abre'].checked = f.lun_abre.checked; f[d + '_a'].value = f.lun_a.value; f[d + '_c'].value = f.lun_c.value; }); toast('Copiado. Toca «Guardar horario».'); },
  // administración
  filtroA: el => { SA.filtro = el.dataset.f; render(); },
  editarLocal: el => { SA.sel = el.dataset.id; formLocal(el.dataset.id); },
  irLocal: el => { SA.sel = el.dataset.id; ir('#/a/locales'); setTimeout(() => formLocal(el.dataset.id), 50); },
  altaNegocio: el => {
    const id = el.dataset.id;
    modal(`<h3>Dar de alta negocio · ${esc(LOC(id).nombre)}</h3><form class="form" data-f="alta" data-id="${id}">
      <label>Nombre del negocio<input name="nombre" required maxlength="40"></label>
      <div class="dos"><label>Giro<input name="giro" required placeholder="Ej. cafetería"></label><label>Categoría<select name="cat">${CATS.map(k => `<option value="${k.id}">${k.e} ${k.n}</option>`).join('')}</select></label></div>
      <label>WhatsApp del encargado<input name="whatsapp" inputmode="tel"></label>
      <button class="btn">Crear y generar código de acceso</button></form>`);
  },
  editarAviso: el => formAviso(el.dataset.id && DB.avisos.find(a => a.id === el.dataset.id)),
  borrarAviso: el => { DB.avisos = DB.avisos.filter(a => a.id !== el.dataset.id); guardar(); cerrarModal(); render(); },
  reiniciar: () => { if (confirm('¿Volver todos los datos de la demo a como estaban al inicio?')) { DB = semilla(); guardar(); toast('Demo reiniciada'); render(); } },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = A[el.dataset.a]; if (!f) return;
  if (el.tagName !== 'A' || el.dataset.a !== 'tabRecomp') e.preventDefault();
  if (el.dataset.a === 'salirNegocio') { f(el); ir('#/n'); return; }
  f(el, e);
});

/* ---------------- Formularios ---------------- */
const datos = f => Object.fromEntries(new FormData(f));
const F = {
  perfilCliente: (f, d) => { Object.assign(DB.cliente, {nombre:d.nombre.trim(), correo:d.correo.trim()}); guardar(); toast('Perfil guardado'); render(); },
  solicitud: (f, d) => {
    const l = LOC(f.dataset.id);
    DB.solicitudes.push({...d, local:l.nombre, fecha:new Date().toLocaleString('es-MX', {dateStyle:'short', timeStyle:'short'}), vista:false}); guardar();
    modal(`<div style="text-align:center"><div style="font-size:48px">✅</div><h3 style="padding:0">¡Recibimos tu solicitud!</h3><p class="sub">Para el ${esc(l.nombre)}. Te escribimos por WhatsApp hoy mismo, ${esc(d.nombre.split(' ')[0])}.</p><button class="btn ancho" style="margin-top:16px" data-a="cerrarModal">Listo</button></div>`);
  },
  perfilNegocio: (f, d) => { const n = DB.negocios[DB.sesion]; ['nombre','giro','cat','desc','color','emoji','whatsapp','telefono','instagram','facebook','web'].forEach(k => n[k] = (d[k] || '').trim()); if (!n.emoji) n.emoji = CAT(n.cat).e; guardar(); toast('Perfil guardado. Ya se ve en la app.'); render(); },
  producto: (f, d) => {
    const n = DB.negocios[DB.sesion], id = f.dataset.id;
    const p = {nombre:d.nombre.trim(), precio:d.precio.trim(), cat:d.cat.trim() || 'General', desc:d.desc.trim(), foto:d.foto};
    if (id) Object.assign(n.productos.find(x => x.id === id), p); else n.productos.push({id:'p' + Date.now(), activo:true, ...p});
    guardar(); cerrarModal(); render(); toast('Producto guardado');
  },
  promo: (f, d) => {
    const n = DB.negocios[DB.sesion], id = f.dataset.id;
    if (d.hasta < d.desde) return toast('La fecha final debe ser después de la inicial.');
    const p = {titulo:d.titulo.trim(), desc:d.desc.trim(), desde:d.desde, hasta:d.hasta, destacada:!!d.destacada, img:d.img};
    if (id) Object.assign(n.promos.find(x => x.id === id), p); else n.promos.unshift({id:'pr' + Date.now(), ...p});
    guardar(); cerrarModal(); render(); toast('Promoción publicada');
  },
  horario: (f, d) => {
    const n = DB.negocios[DB.sesion];
    DIAS.forEach(dd => { n.horario[dd] = {a:d[dd + '_a'] || '09:00', c:d[dd + '_c'] === '23:59' ? '24:00' : (d[dd + '_c'] || '20:00'), cerrado:!d[dd + '_abre']}; });
    guardar(); toast('Horario guardado'); render();
  },
  darPuntos: (f, d) => {
    const n = DB.negocios[DB.sesion], cod = d.cod.trim().toUpperCase(), monto = +d.monto;
    if (cod !== DB.cliente.codigo) return toast(`No encontramos el cliente ${cod}. En la demo usa ${DB.cliente.codigo}.`);
    const p = Math.floor(monto / DB.config.pesosPorPunto); if (p < 1) return toast(`La compra mínima para dar puntos es de $${DB.config.pesosPorPunto}.`);
    const c = DB.cliente; c.puntos += p; c.acumulados += p;
    const hoy = new Date().toISOString().slice(0, 10);
    c.historial.unshift({f:hoy, t:n.nombre, d:`Compra de $${monto.toLocaleString('es-MX')}`, p});
    DB.stats[n.id].pts += p; DB.movs.push({n:n.id, f:fFecha(hoy), t:'Puntos dados', d:`${p} puntos a ${c.nombre} (${cod}) por $${monto.toLocaleString('es-MX')}`});
    guardar(); toast(`Listo: ${p} puntos para ${c.nombre}`); render();
  },
  validarCupon: (f, d) => {
    const n = DB.negocios[DB.sesion], cod = d.cod.trim().toUpperCase();
    const k = DB.cliente.cupones.find(x => x.codigo === cod);
    if (!k) return toast('Ese cupón no existe.');
    if (k.n !== n.id) return toast(`Ese cupón es de ${k.negocio}.`);
    if (k.usado) return toast('Ese cupón ya se usó.');
    k.usado = true; DB.stats[n.id].cupones++;
    DB.movs.push({n:n.id, f:fFecha(new Date().toISOString().slice(0, 10)), t:'Cupón canjeado', d:`${k.titulo} · ${k.codigo}`});
    guardar(); modal(`<div style="text-align:center"><div style="font-size:48px">✅</div><h3 style="padding:0">Cupón válido</h3><p class="sub">Entrega: <b>${esc(k.titulo)}</b>. Ya quedó marcado como usado.</p><button class="btn ancho" style="margin-top:16px" data-a="cerrarModal">Listo</button></div>`); render();
  },
  recomp: (f, d) => {
    const n = DB.negocios[DB.sesion], id = f.dataset.id, r = {titulo:d.titulo.trim(), puntos:Math.max(1, +d.puntos), desc:d.desc.trim()};
    if (id) Object.assign(n.recompensas.find(x => x.id === id), r); else n.recompensas.push({id:'r' + Date.now(), ...r});
    guardar(); cerrarModal(); render(); toast('Recompensa guardada');
  },
  local: (f, d) => { DB.rentas[f.dataset.id] = {estado:d.estado, renta:+d.renta || 0}; guardar(); cerrarModal(); render(); toast('Local actualizado'); },
  alta: (f, d) => {
    const id = f.dataset.id, cat = d.cat;
    const n = {id, nombre:d.nombre.trim(), giro:d.giro.trim(), cat, color:'#5C6B57', emoji:CAT(cat).e, desc:'', logo:'', portada:'', fotos:[],
      horario:Object.fromEntries(DIAS.map(x => [x, {a:'10:00', c:'20:00', cerrado:false}])), whatsapp:d.whatsapp.trim(), telefono:'', instagram:'', facebook:'', web:'',
      productos:[], promos:[], recompensas:[], publicado:true, prox:true, codigo:'NEG-' + codigo()};
    DB.negocios[id] = n; DB.stats[id] = {visitas:[0,0,0,0,0,0,0], wa:0, pts:0, cupones:0}; guardar();
    modal(`<h3>Negocio creado</h3><p class="sub">Comparte este código con ${esc(n.nombre)} para que entre a su panel y cargue su información:</p><div class="cupon" style="justify-content:center;margin:14px 0"><div class="cod">${n.codigo}</div></div><p class="sub">Aparece en la app como «Próximamente» hasta que lo marques como abierto en Negocios.</p><button class="btn ancho" style="margin-top:14px" data-a="cerrarModal">Listo</button>`);
    render();
  },
  aviso: (f, d) => {
    const id = f.dataset.id, a = {tipo:d.tipo, fecha:d.fecha, titulo:d.titulo.trim(), texto:d.texto.trim(), para:d.para};
    if (id) Object.assign(DB.avisos.find(x => x.id === id), a); else DB.avisos.push({id:'e' + Date.now(), ...a});
    guardar(); cerrarModal(); render(); toast('Publicado');
  },
  config: (f, d) => {
    const c = DB.config; c.programa = d.programa.trim(); c.pesosPorPunto = Math.max(1, +d.pesosPorPunto); c.bono = Math.max(0, +d.bono);
    c.niveles = c.niveles.map(([n, p], i) => [n, i === 0 ? 0 : Math.max(1, +d['nivel' + i])]);
    guardar(); toast('Reglas guardadas'); render();
  },
};
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset.f || !F[f.dataset.f]) return;
  e.preventDefault(); F[f.dataset.f](f, datos(f));
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in === 'q') { ST.q = el.value; $('#listaTiendas').innerHTML = listaTiendas(); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.ch === 'notif') { DB.cliente.notif[el.dataset.k] = el.checked; guardar(); toast('Preferencia guardada'); }
  if (el.dataset.ch === 'prodActivo') { DB.negocios[DB.sesion].productos.find(p => p.id === el.dataset.id).activo = el.checked; guardar(); render(); }
  if (el.dataset.ch === 'publicar') { DB.negocios[el.dataset.id].publicado = el.checked; guardar(); toast(el.checked ? 'Publicado en la app' : 'Oculto de la app'); }
  if (el.dataset.ch === 'estadoNeg') { DB.negocios[el.dataset.id].prox = el.value === 'prox'; guardar(); toast('Estado actualizado'); }
  if (el.dataset.file) {
    const campo = el.dataset.file, files = [...el.files]; if (!files.length) return;
    try {
      if (campo === 'fotos') {
        const n = DB.negocios[DB.sesion];
        for (const fl of files.slice(0, 12)) n.fotos.push(await leerImagen(fl, 1100));
        guardar(); render(); toast(files.length > 1 ? `${Math.min(files.length, 12)} fotos agregadas` : 'Foto agregada');
      } else if (campo === 'logo' || campo === 'portada') {
        DB.negocios[DB.sesion][campo] = await leerImagen(files[0], campo === 'logo' ? 400 : 1400); guardar(); render(); toast(campo === 'logo' ? 'Logo actualizado' : 'Portada actualizada');
      } else {
        const img = await leerImagen(files[0], 900), caja = $('#' + campo), form = caja.closest('form');
        form[campo === 'prodFoto' ? 'foto' : 'img'].value = img;
        caja.style.backgroundImage = `url(${img})`; caja.classList.add('con-img'); caja.querySelector('span').textContent = 'Cambiar imagen';
      }
    } catch (err) { toast('No pudimos leer esa imagen. Prueba con una foto JPG o PNG.'); }
  }
});

render();
</script>
</body>
</html>
